# ペイン分割
bind - split-window -v
bind | split-window -h

# prefix + r で設定を再読込
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Dracula: 高コントラストなステータスライン
set -g @dracula-plugins "cwd"
set -g @dracula-show-left-icon "#S"
set -g @dracula-show-flags true
set -g @dracula-show-powerline false
set -g @dracula-border-contrast true
set -g @dracula-refresh-rate 2
set -g @dracula-cwd-max-dirs 3
set -g @dracula-cwd-max-chars 32
set -g @dracula-cwd-colors "cyan dark_gray"

# ウィンドウ名を「フォルダ:フォアグラウンドコマンド」に自動更新
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}:#{?#{m|r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"

# セッションの保存/復元
# prefix + Ctrl-s で保存, prefix + Ctrl-r で復元（continuum が自動保存/自動復元も担当）
set -g @resurrect-capture-pane-contents "on"   # ペインの表示内容も保存
set -g @resurrect-strategy-nvim "session"      # nvim のセッションを復元
set -g @continuum-save-interval "5"            # 5分ごとに自動保存
set -g @continuum-restore "on"                 # tmux 起動時に自動復元

run "$HOME/.config/tmux/plugins/dracula/tmux/dracula.tmux"
# continuum は resurrect より後に読み込むこと
run "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
run "$HOME/.config/tmux/plugins/tmux-continuum/continuum.tmux"
